<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprenda Português - Brazilian Portuguese Audio Player (101-200)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Inter & Outfit Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brazil: {
              green: '#009b3a',
              darkgreen: '#007a2d',
              teal: '#008080',
              yellow: '#fedf00',
              amber: '#d97706',
              blue: '#002776',
              softbg: '#f4f9f5'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar and active sentence highlight styles */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #009b3a;
      border-radius: 4px;
    }
    .playing-card {
      border-left: 6px solid #009b3a !important;
      background-color: #f0fdf4 !important;
      box-shadow: 0 4px 12px rgba(0, 155, 58, 0.12);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-32 min-h-screen">

  <!-- TOP HEADER -->
  <header class="bg-gradient-to-r from-emerald-800 via-brazil-green to-teal-700 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-4 sm:px-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-brazil-yellow text-brazil-blue rounded-xl flex items-center justify-center font-black text-xl shadow-md border-2 border-white/30">
          🇧🇷
        </div>
        <div>
          <h1 class="font-display font-bold text-xl sm:text-2xl tracking-tight leading-none text-white">
            Português do Brasil
          </h1>
          <p class="text-xs sm:text-sm text-emerald-100 mt-1 font-medium">
            Hyperpolyglot Sentences 101–200 • Audio Learning Player
          </p>
        </div>
      </div>

      <!-- Quick Stats & TTS Warning badge -->
      <div class="flex items-center gap-2 text-xs">
        <span id="voiceStatusBadge" class="bg-emerald-900/60 text-emerald-200 border border-emerald-400/30 px-3 py-1.5 rounded-full flex items-center gap-1.5">
          <i class="fa-solid fa-spinner fa-spin"></i> Initializing Speech...
        </span>
        <button id="favOnlyToggle" onclick="toggleFavoritesFilter()" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 px-3 py-1.5 rounded-full transition flex items-center gap-1.5">
          <i class="fa-regular fa-star text-brazil-yellow"></i>
          <span>Favorites (<span id="favCount">0</span>)</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-6">

    <!-- CONTROLS & FILTERS SECTION -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-5 mb-6">
      <div class="flex flex-col lg:flex-row gap-4 justify-between lg:items-center">
        
        <!-- Search Bar -->
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" placeholder="Search Portuguese, English, or word breakdown..."
                 class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brazil-green focus:bg-white transition"
                 oninput="handleSearch()">
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>

        <!-- Mode Selectors -->
        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
          
          <!-- Audio Sequence Mode -->
          <div class="flex flex-col">
            <label class="text-[10px] font-bold tracking-wider text-slate-400 uppercase mb-0.5">Playback Mode</label>
            <select id="playModeSelect" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs sm:text-sm rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-brazil-green outline-none">
              <option value="PT_ONLY">Portuguese Only</option>
              <option value="PT_EN" selected>Portuguese ➔ English</option>
              <option value="EN_PT">English ➔ Portuguese</option>
              <option value="EN_ONLY">English Only</option>
            </select>
          </div>

          <!-- Speed Selector -->
          <div class="flex flex-col">
            <label class="text-[10px] font-bold tracking-wider text-slate-400 uppercase mb-0.5">Speed Rate</label>
            <select id="speedRateSelect" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs sm:text-sm rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-brazil-green outline-none">
              <option value="0.5">0.5x (Very Slow)</option>
              <option value="0.7" selected>0.7x (Slow)</option>
              <option value="1.0">1.0x (Normal)</option>
              <option value="1.2">1.2x (Fast)</option>
            </select>
          </div>

          <!-- Auto Play / Loop Toggle -->
          <div class="flex items-center gap-1.5 mt-4 sm:mt-auto">
            <button id="autoNextBtn" onclick="toggleAutoNext()" title="Toggle Auto Next"
                    class="px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-slate-200 bg-slate-50 text-slate-600 flex items-center gap-1.5 transition">
              <i class="fa-solid fa-forward-step text-slate-400"></i>
              <span>Auto-Next</span>
            </button>
            <button id="loopSingleBtn" onclick="toggleLoopSingle()" title="Toggle Repeat Current"
                    class="px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-slate-200 bg-slate-50 text-slate-600 flex items-center gap-1.5 transition">
              <i class="fa-solid fa-rotate-right text-slate-400"></i>
              <span>Loop 1</span>
            </button>
          </div>

        </div>
      </div>

      <!-- Categories Filter Tabs -->
      <div class="mt-4 pt-4 border-t border-slate-100">
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="categoryTabs">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- LIST HEADER & ACTION SUMMARY -->
    <div class="flex items-center justify-between mb-4 px-1">
      <div class="text-sm font-medium text-slate-500">
        Showing <span id="visibleCount" class="font-bold text-slate-800">0</span> sentences
      </div>
      <button onclick="playAllFiltered()" class="text-xs sm:text-sm font-semibold text-brazil-green hover:text-brazil-darkgreen flex items-center gap-1.5 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200 transition">
        <i class="fa-solid fa-play"></i> Play All Filtered
      </button>
    </div>

    <!-- SENTENCES LIST CONTAINER -->
    <div id="sentencesList" class="space-y-3">
      <!-- Cards rendered here by Javascript -->
    </div>

  </main>

  <!-- BOTTOM FIXED AUDIO PLAYER BAR -->
  <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-2xl z-40 px-4 py-3">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      
      <!-- Current Sentence Info -->
      <div class="flex items-center gap-3 w-full sm:w-1/3 min-w-0">
        <div id="playerNumBadge" class="w-10 h-10 rounded-xl bg-slate-100 text-slate-600 font-bold flex items-center justify-center text-sm shrink-0 border border-slate-200">
          #
        </div>
        <div class="min-w-0 flex-1">
          <p id="playerPT" class="text-sm font-bold text-slate-900 truncate">Select a sentence to start</p>
          <p id="playerEN" class="text-xs text-slate-500 truncate">Clique no botão de reprodução</p>
        </div>
      </div>

      <!-- Player Controls Buttons -->
      <div class="flex items-center justify-center gap-3 w-full sm:w-1/3">
        <button onclick="playPrevSentence()" class="p-2 text-slate-600 hover:text-brazil-green transition rounded-lg hover:bg-slate-100 text-lg">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button id="mainPlayBtn" onclick="toggleMainPlay()" class="w-12 h-12 bg-brazil-green hover:bg-brazil-darkgreen text-white rounded-full flex items-center justify-center text-xl shadow-lg shadow-emerald-600/30 transition transform active:scale-95">
          <i class="fa-solid fa-play ml-0.5"></i>
        </button>
        <button onclick="playNextSentence()" class="p-2 text-slate-600 hover:text-brazil-green transition rounded-lg hover:bg-slate-100 text-lg">
          <i class="fa-solid fa-forward-step"></i>
        </button>
      </div>

      <!-- Secondary Controls & Status -->
      <div class="flex items-center justify-end gap-3 w-full sm:w-1/3 text-xs text-slate-500">
        <span id="speechStateLabel" class="hidden sm:inline-block font-medium bg-slate-100 px-2.5 py-1 rounded-md border border-slate-200">
          Ready
        </span>
        <button onclick="stopSpeech()" class="px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-100 text-slate-600 font-medium transition">
          <i class="fa-solid fa-stop mr-1"></i> Stop
        </button>
      </div>

    </div>
  </div>

  <!-- JAVASCRIPT APPLICATION LOGIC -->

    // --- 2. GLOBAL STATE ---
    let currentCategory = "ALL";
    let searchQuery = "";
    let favorites = new Set(JSON.parse(localStorage.getItem("pt_favs") || "[]"));
    let showFavsOnly = false;

    let currentSentenceIndex = -1; // Pointer in current visible list
    let activeFilteredList = [];
    
    let isPlaying = false;
    let autoNext = false;
    let loopSingle = false;

    // Speech Synthesis
    const synth = window.speechSynthesis;
    let voices = [];
    let ptVoice = null;
    let enVoice = null;

    // --- 3. INITIALIZATION ---
    window.addEventListener("DOMContentLoaded", () => {
      initVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = initVoices;
      }

      renderCategories();
      updateFilteredSentences();
      updateFavBadgeCount();
    });

    function initVoices() {
      voices = synth.getVoices();
      
      // Find PT-BR voice
      ptVoice = voices.find(v => v.lang === 'pt-BR' || v.lang.startsWith('pt_BR')) ||
                voices.find(v => v.lang.startsWith('pt')) || null;

      // Find EN voice
      enVoice = voices.find(v => v.lang === 'en-US' || v.lang === 'en-GB') ||
                voices.find(v => v.lang.startsWith('en')) || null;

      const badge = document.getElementById("voiceStatusBadge");
      if (ptVoice) {
        badge.className = "bg-emerald-900/60 text-emerald-200 border border-emerald-400/30 px-3 py-1.5 rounded-full flex items-center gap-1.5";
        badge.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> Speech Ready (${ptVoice.name.split(' ')[0]})`;
      } else {
        badge.className = "bg-amber-900/60 text-amber-200 border border-amber-400/30 px-3 py-1.5 rounded-full flex items-center gap-1.5";
        badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-300"></i> Standard TTS Mode`;
      }
    }

    // --- 4. RENDER CATEGORIES TABS ---
    function renderCategories() {
      const categories = [
        "ALL",
        "Daily Routine & Home",
        "Opinions & Feelings",
        "Conversation & Getting to Know People",
        "Work & Online Life",
        "Hobbies & Going Out",
        "Accommodation",
        "Phone, Money & Services",
        "Health",
        "Everyday Conversation Phrases"
      ];

      const container = document.getElementById("categoryTabs");
      container.innerHTML = categories.map(cat => {
        const isSelected = currentCategory === cat;
        const activeClass = isSelected
          ? "bg-brazil-green text-white shadow-md font-semibold"
          : "bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium";
        
        const label = cat === "ALL" ? "All Sentences" : cat;
        return `
          <button onclick="selectCategory('${cat}')" 
                  class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm whitespace-nowrap transition-all ${activeClass}">
            ${label}
          </button>
        `;
      }).join('');
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      updateFilteredSentences();
    }

    // --- 5. FILTERING LOGIC ---
    function updateFilteredSentences() {
      activeFilteredList = SENTENCES_DATA.filter(item => {
        // Category Filter
        if (currentCategory !== "ALL" && item.category !== currentCategory) return false;
        
        // Favorites Filter
        if (showFavsOnly && !favorites.has(item.id)) return false;

        // Search Query
        if (searchQuery.trim() !== "") {
          const q = searchQuery.toLowerCase();
          const matchPt = item.pt.toLowerCase().includes(q);
          const matchEn = item.en.toLowerCase().includes(q);
          const matchBreakdown = item.breakdown.some(b => b.pt.toLowerCase().includes(q) || b.en.toLowerCase().includes(q));
          const matchId = item.id.toString().includes(q);
          if (!matchPt && !matchEn && !matchBreakdown && !matchId) return false;
        }

        return true;
      });

      document.getElementById("visibleCount").textContent = activeFilteredList.length;
      renderSentencesList();
    }

    // --- 6. RENDER CARDS ---
    function renderSentencesList() {
      const container = document.getElementById("sentencesList");

      if (activeFilteredList.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 p-6">
            <i class="fa-solid fa-face-meh text-4xl text-slate-300 mb-3"></i>
            <p class="text-slate-600 font-medium">No Portuguese sentences match your current search/filter.</p>
            <button onclick="resetFilters()" class="mt-3 text-xs bg-emerald-100 text-emerald-800 font-semibold px-4 py-2 rounded-xl">Reset Filters</button>
          </div>
        `;
        return;
      }

      container.innerHTML = activeFilteredList.map((item, index) => {
        const isFav = favorites.has(item.id);
        const isCurrentlyPlaying = (currentSentenceIndex >= 0 && activeFilteredList[currentSentenceIndex]?.id === item.id);

        return `
          <div id="card-${item.id}" class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/80 transition-all duration-200 ${isCurrentlyPlaying ? 'playing-card' : 'hover:border-slate-300 shadow-sm'}">
            
            <div class="flex items-start justify-between gap-3">
              <!-- Number badge & Portuguese Text -->
              <div class="flex items-start gap-3 min-w-0">
                <span class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-800 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">
                  ${item.id}
                </span>
                <div class="min-w-0">
                  <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-snug">
                    ${highlightSearch(item.pt, searchQuery)}
                  </h3>
                  <p class="text-xs sm:text-sm text-slate-600 font-medium mt-0.5">
                    ${highlightSearch(item.en, searchQuery)}
                  </p>
                </div>
              </div>

              <!-- Star / Favorite -->
              <button onclick="toggleFav(${item.id})" class="text-lg p-1.5 text-slate-300 hover:text-brazil-amber transition shrink-0">
                <i class="${isFav ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star"></i>
              </button>
            </div>

            <!-- Notes if present -->
            ${item.note ? `
              <div class="mt-3 text-xs bg-amber-50 text-amber-800 border border-amber-200/70 px-3 py-2 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-lightbulb text-amber-500 shrink-0"></i>
                <span>${item.note}</span>
              </div>
            ` : ''}

            <!-- Collapsible Word Breakdown -->
            <details class="mt-3 group">
              <summary class="text-xs font-semibold text-slate-400 hover:text-brazil-green cursor-pointer list-none flex items-center gap-1">
                <i class="fa-solid fa-chevron-right text-[10px] group-open:rotate-90 transition-transform"></i>
                <span>Word-by-word Breakdown</span>
              </summary>
              <div class="mt-2.5 flex flex-wrap gap-1.5 pt-1">
                ${item.breakdown.map(b => `
                  <span class="inline-flex flex-col bg-slate-100 border border-slate-200/80 px-2.5 py-1 rounded-lg text-xs">
                    <span class="font-bold text-slate-800">${b.pt}</span>
                    <span class="text-[10px] text-amber-700 font-medium">${b.en}</span>
                  </span>
                `).join('')}
              </div>
            </details>

            <!-- Card Control Buttons -->
            <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${item.category}</span>
              
              <div class="flex items-center gap-1.5">
                <button onclick="playSingleText('${escapeJsString(item.pt)}', 'pt')" 
                        class="px-2.5 py-1.5 bg-slate-100 hover:bg-emerald-100 text-slate-700 hover:text-emerald-800 rounded-lg text-xs font-semibold flex items-center gap-1 transition" title="Listen PT">
                  <i class="fa-solid fa-volume-high text-emerald-600"></i> PT
                </button>
                <button onclick="playSingleText('${escapeJsString(item.en)}', 'en')" 
                        class="px-2.5 py-1.5 bg-slate-100 hover:bg-blue-100 text-slate-700 hover:text-blue-800 rounded-lg text-xs font-semibold flex items-center gap-1 transition" title="Listen EN">
                  <i class="fa-solid fa-volume-high text-blue-600"></i> EN
                </button>
                <button onclick="playSentenceByIndex(${index})" 
                        class="px-3 py-1.5 bg-brazil-green hover:bg-brazil-darkgreen text-white rounded-lg text-xs font-semibold flex items-center gap-1 shadow-sm transition">
                  <i class="fa-solid fa-play text-[10px]"></i> Play Sequence
                </button>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    // Helper to escape single quotes in strings for JS inline calls
    function escapeJsString(str) {
      return str.replace(/'/g, "\\'");
    }

    function highlightSearch(text, query) {
      if (!query) return text;
      const regex = new RegExp(`(${query})`, 'gi');
      return text.replace(regex, `<mark class="bg-yellow-200 text-slate-900 rounded-sm px-0.5">$1</mark>`);
    }

    // --- 7. AUDIO SPEECH LOGIC ---
    function playSentenceByIndex(index) {
      if (index < 0 || index >= activeFilteredList.length) return;
      
      currentSentenceIndex = index;
      const item = activeFilteredList[currentSentenceIndex];

      // Update Bottom Player UI
      document.getElementById("playerNumBadge").textContent = item.id;
      document.getElementById("playerPT").textContent = item.pt;
      document.getElementById("playerEN").textContent = item.en;
      
      renderSentencesList(); // re-render to update highlighted card

      // Scroll highlighted card gently into view if needed
      const cardEl = document.getElementById(`card-${item.id}`);
      if (cardEl) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      executeSentenceAudioSequence(item);
    }

    function executeSentenceAudioSequence(item) {
      stopSpeech(); // cancel ongoing speech

      const mode = document.getElementById("playModeSelect").value;
      const speed = parseFloat(document.getElementById("speedRateSelect").value);

      isPlaying = true;
      updatePlayStateUI(true);

      const utterances = [];

      if (mode === "PT_ONLY") {
        utterances.push(createUtterance(item.pt, 'pt', speed));
      } else if (mode === "PT_EN") {
        utterances.push(createUtterance(item.pt, 'pt', speed));
        utterances.push(createUtterance(item.en, 'en', speed, 300)); // slight pause
      } else if (mode === "EN_PT") {
        utterances.push(createUtterance(item.en, 'en', speed));
        utterances.push(createUtterance(item.pt, 'pt', speed, 300));
      } else if (mode === "EN_ONLY") {
        utterances.push(createUtterance(item.en, 'en', speed));
      }

      // Chain speech utterances
      utterances.forEach((utt, i) => {
        if (i === utterances.length - 1) {
          utt.onend = () => {
            if (loopSingle) {
              setTimeout(() => playSentenceByIndex(currentSentenceIndex), 400);
            } else if (autoNext) {
              setTimeout(() => playNextSentence(), 600);
            } else {
              isPlaying = false;
              updatePlayStateUI(false);
            }
          };
        }
        synth.speak(utt);
      });
    }

    function createUtterance(text, lang, rate, delayMs = 0) {
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = rate;

      if (lang === 'pt') {
        utt.lang = 'pt-BR';
        if (ptVoice) utt.voice = ptVoice;
      } else {
        utt.lang = 'en-US';
        if (enVoice) utt.voice = enVoice;
      }

      return utt;
    }

    function playSingleText(text, lang) {
      stopSpeech();
      const speed = parseFloat(document.getElementById("speedRateSelect").value);
      const utt = createUtterance(text, lang, speed);
      
      isPlaying = true;
      updatePlayStateUI(true);
      
      utt.onend = () => {
        isPlaying = false;
        updatePlayStateUI(false);
      };
      
      synth.speak(utt);
    }

    function stopSpeech() {
      if (synth.speaking || synth.pending) {
        synth.cancel();
      }
      isPlaying = false;
      updatePlayStateUI(false);
    }

    function toggleMainPlay() {
      if (isPlaying) {
        stopSpeech();
      } else {
        if (currentSentenceIndex >= 0 && currentSentenceIndex < activeFilteredList.length) {
          playSentenceByIndex(currentSentenceIndex);
        } else if (activeFilteredList.length > 0) {
          playSentenceByIndex(0);
        }
      }
    }

    function playNextSentence() {
      if (activeFilteredList.length === 0) return;
      let nextIndex = currentSentenceIndex + 1;
      if (nextIndex >= activeFilteredList.length) nextIndex = 0; // loop back to start
      playSentenceByIndex(nextIndex);
    }

    function playPrevSentence() {
      if (activeFilteredList.length === 0) return;
      let prevIndex = currentSentenceIndex - 1;
      if (prevIndex < 0) prevIndex = activeFilteredList.length - 1;
      playSentenceByIndex(prevIndex);
    }

    function playAllFiltered() {
      if (activeFilteredList.length > 0) {
        autoNext = true;
        updateAutoNextUI();
        playSentenceByIndex(0);
      }
    }

    function updatePlayStateUI(playing) {
      const btn = document.getElementById("mainPlayBtn");
      const label = document.getElementById("speechStateLabel");
      
      if (playing) {
        btn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
        btn.className = "w-12 h-12 bg-amber-500 hover:bg-amber-600 text-white rounded-full flex items-center justify-center text-xl shadow-lg shadow-amber-600/30 transition transform active:scale-95";
        label.textContent = "Speaking...";
        label.className = "hidden sm:inline-block font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-md border border-emerald-300 animate-pulse";
      } else {
        btn.innerHTML = `<i class="fa-solid fa-play ml-0.5"></i>`;
        btn.className = "w-12 h-12 bg-brazil-green hover:bg-brazil-darkgreen text-white rounded-full flex items-center justify-center text-xl shadow-lg shadow-emerald-600/30 transition transform active:scale-95";
        label.textContent = "Ready";
        label.className = "hidden sm:inline-block font-medium bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md border border-slate-200";
      }
    }

    // --- 8. UI TOGGLES & SEARCH ---
    function toggleAutoNext() {
      autoNext = !autoNext;
      if (autoNext) loopSingle = false; // mutually exclusive
      updateAutoNextUI();
      updateLoopSingleUI();
    }

    function updateAutoNextUI() {
      const btn = document.getElementById("autoNextBtn");
      if (autoNext) {
        btn.className = "px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-emerald-300 bg-emerald-100 text-emerald-800 flex items-center gap-1.5 transition";
      } else {
        btn.className = "px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-slate-200 bg-slate-50 text-slate-600 flex items-center gap-1.5 transition";
      }
    }

    function toggleLoopSingle() {
      loopSingle = !loopSingle;
      if (loopSingle) autoNext = false;
      updateLoopSingleUI();
      updateAutoNextUI();
    }

    function updateLoopSingleUI() {
      const btn = document.getElementById("loopSingleBtn");
      if (loopSingle) {
        btn.className = "px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-emerald-300 bg-emerald-100 text-emerald-800 flex items-center gap-1.5 transition";
      } else {
        btn.className = "px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-slate-200 bg-slate-50 text-slate-600 flex items-center gap-1.5 transition";
      }
    }

    function handleSearch() {
      searchQuery = document.getElementById("searchInput").value;
      const clearBtn = document.getElementById("clearSearchBtn");
      if (searchQuery.length > 0) {
        clearBtn.classList.remove("hidden");
      } else {
        clearBtn.classList.add("hidden");
      }
      updateFilteredSentences();
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      handleSearch();
    }

    function toggleFavoritesFilter() {
      showFavsOnly = !showFavsOnly;
      const btn = document.getElementById("favOnlyToggle");
      if (showFavsOnly) {
        btn.className = "bg-brazil-yellow text-slate-900 border border-yellow-300 px-3 py-1.5 rounded-full transition flex items-center gap-1.5 font-bold";
      } else {
        btn.className = "bg-white/10 hover:bg-white/20 text-white border border-white/20 px-3 py-1.5 rounded-full transition flex items-center gap-1.5";
      }
      updateFilteredSentences();
    }

    function toggleFav(id) {
      if (favorites.has(id)) {
        favorites.delete(id);
      } else {
        favorites.add(id);
      }
      localStorage.setItem("pt_favs", JSON.stringify(Array.from(favorites)));
      updateFavBadgeCount();
      renderSentencesList();
    }

    function updateFavBadgeCount() {
      document.getElementById("favCount").textContent = favorites.size;
    }

    function resetFilters() {
      currentCategory = "ALL";
      searchQuery = "";
      showFavsOnly = false;
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      renderCategories();
      updateFilteredSentences();
    }
  </script>
</body>
</html>
